name: Journal Service CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # We keep the mysql service just in case, but Maven won't use it if tests are skipped
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: a
          MYSQL_DATABASE: journal_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Package
        # -DskipTests stops Maven from running the contextLoads() check
        run: |
          mvn clean package -DskipTests

      - name: Login to DockerHub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/journal-service:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/journal-service:latest