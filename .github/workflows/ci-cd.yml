name: Journal Service CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: a
          MYSQL_DATABASE: journal_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: mvn clean package \
          -Dspring.datasource.url=jdbc:mysql://localhost:3306/journal_db?useSSL=false \
          -Dspring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/temp \
          -Dspring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/temp/protocol/openid-connect/certs
        env:
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: a

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/journal-service:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/journal-service:latest